name: flutter_vap_kit
description: >-
  Play Tencent VAP transparent (alpha-channel) MP4 animations with one widget:
  seamless looping, automatic first-frame poster, asset and network caching.
version: 0.1.0
homepage: https://github.com/zamansheikh/flutter_vap_kit
repository: https://github.com/zamansheikh/flutter_vap_kit
issue_tracker: https://github.com/zamansheikh/flutter_vap_kit/issues

topics:
  - vap
  - animation
  - video
  - alpha-video
  - gift

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.zamansheikh.flutter_vap_kit
        pluginClass: FlutterVapKitPlugin
      ios:
        pluginClass: FlutterVapKitPlugin
